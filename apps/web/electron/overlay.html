<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindTrace — Breathing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      width: 400px;
      height: 320px;
      margin: 10px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4ade80, #3b82f6, #4ade80);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.06);
      color: #888;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
      transition: background 0.2s;
    }
    .close-btn:hover { background: rgba(0, 0, 0, 0.12); color: #333; }

    .phase-text {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
      min-height: 32px;
      transition: opacity 0.5s;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #86efac, #4ade80);
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.35);
      transition: transform 4s ease-in-out, opacity 0.5s;
    }
    .circle.inhale  { transform: scale(1.6); }
    .circle.hold    { transform: scale(1.6); }
    .circle.exhale  { transform: scale(1); transition-duration: 6s; }

    .skip-btn {
      position: absolute;
      bottom: 18px;
      border: none;
      background: none;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: color 0.2s;
    }
    .skip-btn:hover { color: #1a1a2e; }

    .brand {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand">MINDTRACE</span>
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="phase-text" id="phase">Let's slow down</div>
    <div class="circle" id="circle"></div>
    <button class="skip-btn" id="skipBtn">Skip exercise</button>
  </div>

  <script>
    const phase = document.getElementById('phase');
    const circle = document.getElementById('circle');

    // Breathing cycle: 2s intro → 4s inhale → 4s hold → 6s exhale → done
    setTimeout(() => { phase.textContent = 'Inhale...';  circle.className = 'circle inhale'; }, 2000);
    setTimeout(() => { phase.textContent = 'Hold...';    circle.className = 'circle hold'; },   6000);
    setTimeout(() => { phase.textContent = 'Exhale slowly...'; circle.className = 'circle exhale'; }, 10000);
    setTimeout(() => close(), 16000);

    function close() {
      if (window.electronAPI) window.electronAPI.closeOverlay();
      else window.close();
    }

    document.getElementById('closeBtn').addEventListener('click', close);
    document.getElementById('skipBtn').addEventListener('click', close);
  </script>
</body>
</html>
